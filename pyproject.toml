[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "pycloudsim"
version = "0.1.0"

description = "A Python-native cloud computing simulation framework for modelling cloud infrastructures, resource allocation, scheduling algorithms, and virtual machine management."

readme = "README.md"

requires-python = ">=3.10"

authors = [
    { name = "Goutam Parashuram Gotur", email = "goutamgotur2006@outlook.com"}
]

license = { text = "MIT" }

keywords = [
    "cloud-computing",
    "cloud-simulation",
    "simulation",
    "discrete-event-simulation",
    "cloudsim",
    "resource-allocation",
    "resource-management",
    "scheduling",
    "virtual-machines",
    "datacenter",
    "cloudlets",
    "energy-aware-computing",
    "sla",
    "performance-analysis"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent"
]

dependencies = [
    "rich>=13.0",
    "matplotlib>=3.8"
]


[project.urls]
Homepage = "https://github.com/goutam-tech/pycloudsim"
Repository = "https://github.com/goutam-tech/pycloudsim"
Documentation = "https://goutam-tech.github.io/pycloudsim"
Issues = "https://github.com/goutam-tech/pycloudsim/issues"

[project.scripts]
pycloudsim = "cloudsim.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "black>=24.3.0",
    "mypy>=1.9.0",
    "build>=1.0.0",
    "twine>=5.0.0"
]


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 100
target-version = "py310"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM"
]


[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]


[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cloudsim --cov-report=term-missing"